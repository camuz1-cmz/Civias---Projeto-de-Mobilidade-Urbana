<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIVIAS - Cadastro</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      background-color: var(--bg-primary);
      min-height: 100vh;
    }

    .cadastro-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Responsivo: padding escala com clamp */
      padding: clamp(32px, 6vh, 48px) clamp(18px, 6vw, 28px);
      gap: clamp(20px, 3vh, 28px);
      margin: 0 auto;
    }

    /* Logo */
    .cadastro-logo {
      display: flex;
      align-items: center;
    }

    .cadastro-logo span {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -1px;
    }

    .cadastro-logo svg {
      width: clamp(26px, 6vw, 34px);
      height: clamp(32px, 7vw, 42px);
    }

    /* Título */
    .cadastro-title {
      text-align: center;
    }

    .cadastro-title h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      color: var(--text-primary);
    }

    .cadastro-title p {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .cadastro-title p a {
      color: var(--green-main);
      font-weight: 600;
      text-decoration: none;
    }

    /* Formulário */
    .cadastro-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="cadastro-wrapper">

    <!-- Logo -->
    <div class="cadastro-logo">
      <span>CI</span>
      <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,0 14,0 30,42 46,0 60,0 30,70" fill="#17b83c"/>
        <line x1="30" y1="8"  x2="30" y2="18" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="24" x2="30" y2="34" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="40" x2="30" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span>IAS</span>
    </div>

    <!-- Título -->
    <div class="cadastro-title">
      <h1>Criar conta</h1>
      <p>Já tem uma conta? <a href="login.html">Login</a></p>
    </div>

    <!-- Formulário -->
    <div class="cadastro-form">

      <div class="input-group">

        <!-- Nome -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            id="cadNome"
            placeholder="Seu nome completo"
            autocomplete="name"
          />
        </div>

        <!-- Email -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
          <input
            type="email"
            id="cadEmail"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </div>

        <!-- Data de nascimento -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
          <input
            type="date"
            id="cadNascimento"
            autocomplete="bday"
          />
        </div>

        <!-- CEP -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <input
            type="text"
            id="cadCep"
            placeholder="CEP (ex: 29102-920)"
            maxlength="9"
            autocomplete="postal-code"
          />
        </div>

        <!-- Senha -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="cadSenha"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button class="toggle-password" id="toggleCadSenha" type="button" aria-label="Mostrar senha">
            <svg id="eyeIconCad" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <!-- Telefone -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                     A19.79 19.79 0 0 1 3.08 4.18
                     2 2 0 0 1 5.09 2h3a2 2 0 0 1 2 1.72
                     c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11
                     L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27
                     a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7
                     A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input
            type="tel"
            id="cadTelefone"
            placeholder="(27) 99999-9999"
            maxlength="15"
            autocomplete="tel"
          />
          <button class="toggle-password" id="toggleCadTel" type="button" aria-label="Mostrar telefone">
            <svg id="eyeIconTel" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- Botão registrar -->
      <button class="btn-primary" id="btnRegistrar">Registrar-se</button>

    </div>

  </div>

  <script src="assets/js/cadastro.js"></script>
</body>
</html>
