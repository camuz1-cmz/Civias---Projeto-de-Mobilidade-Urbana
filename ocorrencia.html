<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIVIAS - Registrar Ocorrência</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      background-color: var(--bg-primary);
    }

    /* Header */
    .oc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0;
    }

    .oc-logo {
      display: flex;
      align-items: center;
    }

    .oc-logo span {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .oc-logo svg {
      width: 20px;
      height: 26px;
    }

    .oc-header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .oc-header-user .greet {
      text-align: right;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .oc-header-user .greet strong {
      display: block;
      color: var(--text-primary);
      font-weight: 700;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--green-main);
    }

    /* Título da página */
    .oc-page-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      padding: 16px 20px 0;
    }

    /* Card do formulário */
    .oc-card {
      margin: 16px 20px 0;
      background-color: var(--bg-card);
      border-radius: var(--border-radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Seção */
    .oc-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    /* Mapa de localização */
    .oc-map-wrapper {
      border-radius: var(--border-radius-md);
      overflow: hidden;
      height: 160px;
      position: relative;
      background-color: var(--bg-card-alt);
    }

    .oc-map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: brightness(0.75) saturate(0.6) hue-rotate(180deg);
    }

    .oc-map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 28px;
      height: 28px;
      background-color: #e53e3e;
      border-radius: 50% 50% 50% 0;
      transform: translate(-50%, -80%) rotate(-45deg);
      pointer-events: none;
    }

    .oc-address {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Upload */
    .oc-upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .oc-upload-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      border: 1.5px dashed var(--green-main);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--green-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .oc-upload-btn:hover {
      background: var(--green-glow);
    }

    .oc-upload-btn svg {
      width: 26px;
      height: 26px;
      stroke: var(--green-main);
      fill: none;
      stroke-width: 1.8;
    }

    /* Input file oculto */
    .oc-upload-btn input[type="file"] {
      display: none;
    }

    /* Preview de arquivos */
    .oc-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .oc-preview-item {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      border: 1.5px solid var(--green-main);
    }

    /* Tipos de veículos */
    .oc-vehicles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .oc-vehicle-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 6px;
      border: 1.5px dashed var(--text-muted);
      border-radius: var(--border-radius-md);
      background: transparent;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .oc-vehicle-btn svg {
      width: 30px;
      height: 30px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 1.6;
      transition: stroke 0.2s;
    }

    .oc-vehicle-btn.selected {
      border-color: var(--green-main);
      background: var(--green-glow);
    }

    .oc-vehicle-btn.selected svg {
      stroke: var(--green-main);
    }

    /* Textarea descrição */
    .oc-textarea {
      width: 100%;
      background-color: var(--bg-card-alt);
      border: none;
      border-radius: var(--border-radius-md);
      padding: 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      resize: none;
      height: 100px;
      outline: none;
      transition: border 0.2s;
    }

    .oc-textarea:focus {
      border: 1.5px solid var(--green-main);
    }

    .oc-textarea::placeholder {
      color: var(--text-muted);
    }

    /* Severidade */
    .oc-severity {
      display: flex;
      gap: 10px;
    }

    .oc-sev-btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: var(--border-radius-md);
      border: 1.5px solid transparent;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s, border-color 0.2s;
    }

    .oc-sev-btn.baixo {
      border-color: var(--green-main);
      color: var(--green-main);
    }

    .oc-sev-btn.medio {
      border-color: var(--orange);
      color: var(--orange);
    }

    .oc-sev-btn.critico {
      border-color: var(--red);
      color: var(--red);
    }

    .oc-sev-btn.baixo.selected {
      background: rgba(31, 223, 75, 0.15);
    }

    .oc-sev-btn.medio.selected {
      background: rgba(217, 119, 6, 0.15);
    }

    .oc-sev-btn.critico.selected {
      background: rgba(229, 62, 62, 0.15);
    }

    .bottom-space {
      height: calc(var(--navbar-height) + 32px);
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <div class="oc-header">
      <div class="oc-logo">
        <span>CI</span>
        <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
          <polygon points="0,0 14,0 30,42 46,0 60,0 30,70" fill="#17b83c"/>
          <line x1="30" y1="8"  x2="30" y2="18" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="24" x2="30" y2="34" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="40" x2="30" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>IAS</span>
      </div>
      <div class="oc-header-user">
        <div class="greet">
          Olá,<strong id="userName">User</strong>
        </div>
        <img
          class="avatar"
          src="https://api.dicebear.com/7.x/adventurer/svg?seed=civias"
          alt="Avatar"
        />
      </div>
    </div>

    <!-- Título -->
    <div class="oc-page-title">Registrar Ocorrência</div>

    <!-- Card formulário -->
    <div class="oc-card">

      <!-- Localização -->
      <div>
        <div class="oc-section-title">Localização</div>
        <div class="oc-map-wrapper">
          <iframe
            src="https://www.openstreetmap.org/export/embed.html?bbox=-40.3050%2C-20.3350%2C-40.2950%2C-20.3250&layer=mapnik"
            allowfullscreen
            loading="lazy"
            title="Mapa localização"
          ></iframe>
          <div class="oc-map-pin"></div>
        </div>
        <div class="oc-address">Rua de Exemplo, 123 - Vila Velha</div>
      </div>

      <!-- Upload -->
      <div>
        <div class="oc-section-title">Upload</div>
        <div class="oc-upload-grid">

          <label class="oc-upload-btn">
            <svg viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            Fotos
            <input type="file" id="inputFotos" accept="image/*" multiple />
          </label>

          <label class="oc-upload-btn">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="2" width="20" height="20" rx="2.18"/>
              <line x1="7" y1="2" x2="7" y2="22"/>
              <line x1="17" y1="2" x2="17" y2="22"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <line x1="2" y1="7" x2="7" y2="7"/>
              <line x1="2" y1="17" x2="7" y2="17"/>
              <line x1="17" y1="17" x2="22" y2="17"/>
              <line x1="17" y1="7" x2="22" y2="7"/>
            </svg>
            Vídeos
            <input type="file" id="inputVideos" accept="video/*" multiple />
          </label>

        </div>

        <!-- Preview fotos -->
        <div class="oc-preview" id="previewFotos"></div>
      </div>

      <!-- Tipos de veículos -->
      <div>
        <div class="oc-section-title">Tipos de Veículos Frequentes</div>
        <div class="oc-vehicles">

          <!-- Carro -->
          <button class="oc-vehicle-btn" data-vehicle="carro">
            <svg viewBox="0 0 24 24">
              <path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-3h10l2 3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/>
              <circle cx="7.5" cy="17.5" r="2.5"/>
              <circle cx="16.5" cy="17.5" r="2.5"/>
            </svg>
          </button>

          <!-- Ônibus -->
          <button class="oc-vehicle-btn" data-vehicle="onibus">
            <svg viewBox="0 0 24 24">
              <path d="M8 6v6"/>
              <path d="M16 6v6"/>
              <path d="M2 12h20"/>
              <path d="M18 18h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/>
              <circle cx="8" cy="18" r="2"/>
              <circle cx="16" cy="18" r="2"/>
              <path d="M8 20h8"/>
            </svg>
          </button>

          <!-- Moto -->
          <button class="oc-vehicle-btn" data-vehicle="moto">
            <svg viewBox="0 0 24 24">
              <circle cx="5.5" cy="17.5" r="3.5"/>
              <circle cx="18.5" cy="17.5" r="3.5"/>
              <path d="M15 6h-3l-3 7h7.5"/>
              <path d="M9.5 13l2-7"/>
              <path d="M18.5 14H15"/>
            </svg>
          </button>

          <!-- Caminhão -->
          <button class="oc-vehicle-btn" data-vehicle="caminhao">
            <svg viewBox="0 0 24 24">
              <rect x="1" y="3" width="15" height="13" rx="1"/>
              <path d="M16 8h4l3 3v5h-7V8z"/>
              <circle cx="5.5" cy="18.5" r="2.5"/>
              <circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
          </button>

        </div>
      </div>

      <!-- Descrição -->
      <div>
        <textarea
          class="oc-textarea"
          id="ocDescricao"
          placeholder="Descreva o problema da via.."
        ></textarea>
      </div>

      <!-- Severidade -->
      <div>
        <div class="oc-section-title">Severidade</div>
        <div class="oc-severity">
          <button class="oc-sev-btn baixo"   data-sev="baixo">Baixo</button>
          <button class="oc-sev-btn medio"   data-sev="medio">Médio</button>
          <button class="oc-sev-btn critico" data-sev="critico">Crítico</button>
        </div>
      </div>

      <!-- Botão enviar -->
      <button class="btn-primary" id="btnEnviar">Enviar</button>

    </div>

    <div class="bottom-space"></div>

  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="home.html" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="mapa.html" title="Mapa">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </a>
    <a href="ocorrencia.html" class="active" title="Ocorrência">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </a>
    <a href="perfil.html" title="Perfil">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </nav>

  <script src="assets/js/ocorrencia.js"></script>
</body>
</html>
