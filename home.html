<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIVIAS - Home</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      background-color: var(--bg-primary);
    }

    /* Header */
    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0;
    }

    .header-logo {
      display: flex;
      align-items: center;
    }

    .header-logo span {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .header-logo svg {
      width: 20px;
      height: 26px;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-user .greet {
      text-align: right;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .header-user .greet strong {
      display: block;
      color: var(--text-primary);
      font-weight: 700;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--green-main);
    }

    /* Card registrar ocorrência */
    .card-registrar {
      margin: 20px 20px 0;
      background-color: var(--bg-card);
      border-radius: var(--border-radius-lg);
      padding: 20px;
    }

    .card-registrar h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .card-registrar p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn-nova-ocorrencia {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--green-main), var(--green-dark));
      color: #000;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-nova-ocorrencia:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

  #map {
  width: 100%;
  height: 100%;
  z-index: 1;
}
    /* Stats */
    .stats-section {
      margin: 20px 20px 0;
    }

    /* Padding bottom para navbar */
    .bottom-space {
      height: calc(var(--navbar-height) + 32px);
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <div class="home-header">
      <div class="header-logo">
        <span>CI</span>
        <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
          <polygon points="0,0 14,0 30,42 46,0 60,0 30,70" fill="#17b83c"/>
          <line x1="30" y1="8"  x2="30" y2="18" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="24" x2="30" y2="34" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="40" x2="30" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>IAS</span>
      </div>
      <div class="header-user">
        <div class="greet">
          Olá,<strong id="userName">User</strong>
        </div>
        <img
          class="avatar"
          src="https://api.dicebear.com/7.x/adventurer/svg?seed=civias"
          alt="Avatar"
        />
      </div>
    </div>

    <!-- Card registrar -->
    <div class="card-registrar">
      <h2>Registrar Ocorrência</h2>
      <p>Reporte buracos, asfalto danificado ou problemas na sua rua ou bairro.</p>
      <a class="btn-nova-ocorrencia" href="ocorrencia.html">Nova Ocorrência</a>
    </div>

    <!-- Mapa -->
   <div id="map"></div>



    <!-- Stats -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-card red">
          <div class="stat-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Críticas
          </div>
          <div class="stat-number">23</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            Em análise
          </div>
          <div class="stat-number">57</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Resolvidas
          </div>
          <div class="stat-number">148</div>
        </div>
      </div>
    </div>

    <div class="bottom-space"></div>

  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="home.html" class="active" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="mapa.html" title="Mapa">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </a>
    <a href="ocorrencia.html" title="Ocorrência">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </a>
    <a href="perfil.html" title="Perfil">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </nav>

<script src="assets/js/home.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
