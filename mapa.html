<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIVIAS - Mapa do Bairro</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body {
      background-color: var(--bg-primary);
    }

    /* Header */
    .mapa-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px, 4vh, 32px) clamp(14px, 4vw, 20px) clamp(12px, 2vh, 20px);
      gap: 8px;
    }

    .mapa-logo {
      display: flex;
      align-items: center;
    }

    .mapa-logo span {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .mapa-logo svg {
      width: clamp(17px, 4vw, 22px);
      height: clamp(22px, 5vw, 28px);
    }

    .mapa-header h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 12px;
    }

    /* Mapa — altura responsiva, nunca colapsa */
    .mapa-container {
      margin: 0 clamp(14px, 4vw, 20px);
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      position: relative;
      /* clamp: mínimo 280px, ideal 55vh, máximo 420px */
      height: clamp(280px, 55vh, 420px);
      background-color: var(--bg-card);
    }

    /* IMPORTANTE: não mexemos em nada do Leaflet aqui,
       apenas garantimos que o container ocupa 100% do wrapper */
    #map {
      width: 100%;
      height: 100%;
      min-height: clamp(280px, 55vh, 420px);
    }

    /* Rodapé */
    .mapa-footer {
      text-align: center;
      padding: clamp(12px, 2vh, 20px);
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .bottom-space {
      height: calc(var(--navbar-height) + 32px);
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <div class="mapa-header">
      <div class="mapa-logo">
        <span>CI</span>
        <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
          <polygon points="0,0 14,0 30,42 46,0 60,0 30,70" fill="#17b83c"/>
          <line x1="30" y1="8"  x2="30" y2="18" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="24" x2="30" y2="34" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="40" x2="30" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>IAS</span>
      </div>
      <h1>Mapa do Bairro</h1>
    </div>

    <!-- Mapa -->
    <div class="mapa-container">
      <div id="map"></div>
    </div>

    <!-- Rodapé -->
    <div class="mapa-footer">
      Reporte. Contribua com a comunidade.
    </div>

    <div class="bottom-space"></div>

  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="home.html" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="mapa.html" class="active" title="Mapa">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </a>
    <a href="ocorrencia.html" title="Ocorrência">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </a>
    <a href="perfil.html" title="Perfil">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="assets/js/mapa.js"></script>
</body>
</html>
