<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIVIAS - Login</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      background-color: var(--bg-primary);
      min-height: 100vh;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Responsivo: padding menor em telas pequenas via clamp */
      padding: clamp(32px, 6vh, 48px) clamp(18px, 6vw, 28px);
      gap: clamp(24px, 4vh, 32px);
      margin: 0 auto;
    }

    /* Logo */
    .login-logo {
      display: flex;
      align-items: center;
    }

    .login-logo span {
      /* clamp(mínimo, preferido, máximo) — escala suave */
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -1px;
    }

    .login-logo svg {
      width: clamp(26px, 6vw, 34px);
      height: clamp(32px, 7vw, 42px);
    }

    /* Título */
    .login-title {
      text-align: center;
    }

    .login-title h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .login-title p {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .login-title p a {
      color: var(--green-main);
      font-weight: 600;
      text-decoration: none;
    }

    /* Formulário */
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .forgot-password {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
    }

    .forgot-password:hover {
      color: var(--green-main);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">

    <!-- Logo -->
      <div class="login-logo">
        <img src="assets/img/logo-civias.png" alt="CIVIAS" class="logo" />
      </div>

    <!-- Título -->
    <div class="login-title">
      <h1>Faça login com sua<br>conta</h1>
      <p>Não tem uma conta? <a href="cadastro.html">Registre-se</a></p>
    </div>

    <!-- Formulário -->
    <div class="login-form">

      <!-- Campos -->
      <div class="input-group">

        <!-- Email -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
          <input
            type="email"
            id="loginEmail"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </div>

        <!-- Senha -->
        <div class="input-row">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="loginSenha"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button class="toggle-password" id="toggleLoginSenha" type="button" aria-label="Mostrar senha">
            <svg id="eyeIconLogin" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- Esqueceu senha -->
      <a class="forgot-password" href="#">Esqueceu sua senha?</a>

      <!-- Botão entrar -->
      <button class="btn-primary" id="btnEntrar">Entrar</button>

    </div>

  </div>

  <script src="assets/js/login.js"></script>
</body>
</html>
