<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIVIAS</title>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>

    body {
      margin: 0;
      background: #0d0d0d;
      overflow: hidden;
    }

    .splash-screen {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at center,
        rgba(23,184,60,0.12) 0%,
        transparent 60%),
        #0d0d0d;

      transition: opacity 0.6s ease;
    }

    .splash-logo {
      width: clamp(180px, 28vw, 300px);

      opacity: 0;
      transform: scale(0.92);

      animation: logoReveal 1.4s ease forwards;

      filter:
        drop-shadow(0 0 12px rgba(23,184,60,0.25));
    }

    .loading-container {
      width: 180px;
      height: 4px;

      margin-top: 36px;

      background: rgba(255,255,255,0.08);

      border-radius: 999px;

      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;

      background: #17b83c;

      border-radius: 999px;

      animation: loading 2.2s ease forwards;
    }

    @keyframes logoReveal {

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    @keyframes loading {

      to {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <div class="splash-screen" id="splash">

    <img
      src="assets/img/logo-civias.png"
      alt="CIVIAS"
      class="splash-logo"
    />

    <div class="loading-container">
      <div class="loading-bar"></div>
    </div>

  </div>

  <script src="assets/js/splash.js"></script>

</body>
</html>
